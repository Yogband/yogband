<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOG</title>

<style>
  @font-face {
    font-family: "Talina";
    src: url("font/TalinaDemo.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
  }

  :root { --bg:#F2F2F2; --ink:#151515; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }

  body {
    position:relative;
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:400 1.05rem/1.5 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /* Side images */
  #sides {
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }

  #sides img {
    position:absolute;
    height:auto;
    max-width:220px;
  }

  @media (max-width:1100px) {
    #sides { display:none; }
  }

  main {
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:3rem 1.25rem 4rem;
    text-align:center;
  }

  /* YOG TITLE */
  h1 {
    font-family:"Talina", Georgia, serif;
    font-weight:normal;
    font-size:clamp(5rem,22vw,9rem);
    line-height:1;
    margin:0 0 2rem;
    letter-spacing:.02em;
    filter:url(#rough);
  }

  h2 {
    font-size:1.5rem;
    font-weight:700;
    line-height:1.2;
    margin:3.5rem 0 1rem;
  }

  a {
    color:var(--ink);
    text-underline-offset:3px;
  }

  a:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline:3px solid var(--ink);
    outline-offset:3px;
  }

  /* Gigs */
  #gigs {
    list-style:none;
    margin:0;
    padding:0;
  }

  #gigs li {
    padding:.7rem 0;
    border-bottom:2px solid var(--ink);
  }

  #gigs li:first-child {
    border-top:2px solid var(--ink);
  }

  #gigs .date {
    font-weight:600;
  }

  /* Mailing list */
  form {
    display:flex;
    gap:.5rem;
    flex-wrap:wrap;
    justify-content:center;
  }

  input[type=email] {
    flex:1 1 240px;
    padding:.7rem;
    font:inherit;
    border:2px solid var(--ink);
    background:#fff;
  }

  button {
    padding:.7rem 1.4rem;
    font:inherit;
    font-weight:600;
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--bg);
    cursor:pointer;
  }

  /* Bandcamp */
  .bandcamp img {
    display:block;
    margin:0 auto;
    max-width:100%;
    width:320px;
    border:2px solid var(--ink);
  }

  /* Photos */
  #photos {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:.6rem;
  }

  #photos img {
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    display:block;
  }
</style>
</head>

<body>
  
<!-- Slightly roughens the edges of the YOG title. Raise scale for rougher edges. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter></svg>

<div id="sides" aria-hidden="true"></div>

<main>

  <h1>YOG</h1>

  <!-- UPCOMING GIGS -->
  <h2>Upcoming gigs</h2>

  <ul id="gigs">
    <li>
      <span class="date">Mon 2 Nov</span> – The Social, London –
      <a href="https://gel.now/events/1190">Tickets</a>
    </li>
  </ul>

  <!-- BANDCAMP -->
  <h2>Listen</h2>

  <a
    class="bandcamp"
    href="https://yogband.bandcamp.com/"
    target="_blank"
    rel="noopener"
  >
    <img
      src="images/bandcamp_yog-one.jpg"
      alt="Listen to YOG on Bandcamp"
    >
  </a>

  <!-- MAILING LIST -->
  <h2>Join our mailing list for gig updates</h2>

  <form
    action="https://buttondown.com/api/emails/embed-subscribe/yogband"
    method="post"
    class="embeddable-buttondown-form"
  >
    <label for="bd-email">Enter your email</label>

    <input
      type="email"
      name="email"
      id="bd-email"
    />

    <input
      type="submit"
      value="Subscribe"
    />

    <p>
      <a
        href="https://buttondown.com/refer/yogband"
        target="_blank"
      ></a>
    </p>
  </form>

  <style>
    .embeddable-buttondown-form {
      display:flex;
      flex-direction:column;
      gap:8px;
      box-sizing:border-box;
      width:100%;
      max-width:384px;
      margin:0 auto;
      padding:12px;
      border:2px solid var(--ink);
      border-radius:0;
      background:var(--ink);
      color:var(--bg);
      font:14px/1.4 system-ui, sans-serif;
    }

    .embeddable-buttondown-form label {
      font-weight:500;
    }

    .embeddable-buttondown-form input[type="email"] {
      flex:none;
      box-sizing:border-box;
      width:100%;
      padding:6px 8px;
      border:2px solid var(--bg);
      border-radius:0;
      background:var(--bg);
      color:var(--ink);
      font:inherit;
    }

    .embeddable-buttondown-form input[type="submit"] {
      padding:8px 12px;
      border:2px solid var(--bg);
      border-radius:0;
      background:transparent;
      color:var(--bg);
      font:inherit;
      font-weight:600;
      cursor:pointer;
    }

    .embeddable-buttondown-form input:focus-visible {
      outline-color:var(--bg);
    }

    .embeddable-buttondown-form p {
      margin:0;
      font-size:12px;
      text-align:center;
    }

    .embeddable-buttondown-form p a {
      color:var(--bg);
    }
  </style>

  <!-- PHOTOS -->
  <h2>Photos</h2>

  <div id="photos"></div>

  <!-- CONTACT -->
  <h2>Contact</h2>

  <p>
    Get in touch:
    <a href="mailto:theyogband@gmail.com">
      theyogband@gmail.com
    </a>
  </p>

</main>

<script>
  /* ---- EDIT THESE LISTS ---- */

  // Gig photos
  const photos = [
    // "gig-2026-10-01.jpg",
    // "soundcheck.jpg",
  ];

  // Background images
 const sideImages = [
  "bird_small.png",
  "lizard_small.png",
  "spotty_small.png",
  "yellow_small.png",
  "tundra.png",
  "chinesedragon.png",
  "pushhardandhold.png",
  // add as many as you like
];

const SIDE_COUNT = 3; // how many to show at once

  /* ---- Don't need to edit below ---- */

  const grid = document.getElementById('photos');

  photos.forEach(f => {
    const img = document.createElement('img');
    img.src = 'photos/' + f;
    img.alt = 'YOG live';
    img.loading = 'lazy';
    grid.appendChild(img);
  });

  const sides = document.getElementById('sides');

  const GAP = 16;

  // Shuffle so the arrangement differs each load
 // Fisher-Yates shuffle (fairer than sort(() => Math.random() - 0.5))
const shuffled = [...sideImages];
for (let i = shuffled.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
}

const order = shuffled.slice(0, SIDE_COUNT);

  const items = order.map((f, i) => {
    const img = document.createElement('img');
    img.src = 'side/' + f;
    img.alt = '';
    sides.appendChild(img);

    const tries = [];

    for (let t = 0; t < 60; t++) {
      const first = t < 12;

      tries.push({
        right: first ? i % 2 === 1 : Math.random() < 0.5,
        rx: Math.random(),
        ry: first
          ? (i + Math.random()) / order.length
          : Math.random()
      });
    }

    return { img, tries };
  });

  function layout() {
    const W = sides.clientWidth;
    const H = sides.clientHeight;
    const gutter = (W - 640) / 2;
    const placed = [];

    items.forEach(it => {
      const w = it.img.offsetWidth;
      const h = it.img.offsetHeight;
      const room = Math.max(0, gutter - w - 16);

      let best = null;

      for (const c of it.tries) {
        const x = 8 + c.rx * room;
        const left = c.right ? W - x - w : x;
        const top = Math.max(0, c.ry * (H - h));

        let overlap = 0;

        for (const p of placed) {
          const ox =
            Math.min(
              left + w + GAP / 2,
              p.l + p.w + GAP / 2
            ) -
            Math.max(
              left - GAP / 2,
              p.l - GAP / 2
            );

          const oy =
            Math.min(
              top + h + GAP / 2,
              p.t + p.h + GAP / 2
            ) -
            Math.max(
              top - GAP / 2,
              p.t - GAP / 2
            );

          if (ox > 0 && oy > 0) {
            overlap += ox * oy;
          }
        }

        if (!best || overlap < best.overlap) {
          best = {
            left,
            top,
            overlap
          };
        }

        if (overlap === 0) break;
      }

      it.img.style.right = 'auto';
      it.img.style.left = best.left + 'px';
      it.img.style.top = best.top + 'px';

      placed.push({
        l: best.left,
        t: best.top,
        w,
        h
      });
    });
  }

  items.forEach(it => {
    it.img.addEventListener('load', layout);
  });

  new ResizeObserver(layout).observe(sides);
</script>

</body>
</html>
